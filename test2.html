<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Annuaire des Personnes</title>
<style>
  body { 
    font-family: Arial, sans-serif; 
    background: #f5f5f5; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    padding: 20px;
  }

  h1,h3 { margin-bottom: 10px; text-align: center; }

  input, button, select { padding: 8px; margin: 5px; }

  #searchContainer { position: relative; display: flex; align-items: center; justify-content: center; margin-top: 20px; gap: 10px; flex-wrap: wrap; }

  #search { width: 300px; padding: 8px; }

  #helpIcon { cursor: pointer; margin-left: 5px; font-weight: bold; font-size: 18px; }

  #helpPopup { 
    display: none; 
    position: absolute; 
    top: 30px; 
    right: 0; 
    background: #fff; 
    border: 1px solid #ccc; 
    border-radius: 5px; 
    padding: 10px; 
    width: 280px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 10;
  }

  .dashboard {
    width: 90%;
    max-width: 900px;
    background: white;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 15px;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }

  .cards { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; justify-content: center; }

  .card { background: white; padding: 10px; border-radius: 8px; width: 200px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }

  .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }

  #details { display: none; margin-top: 20px; width: 90%; max-width: 900px; }

  .profile-layout { display: flex; gap: 20px; }

  .profile-left, .profile-right { flex: 1; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

  .profile-center { flex: 1; text-align: center; }

  .nav-arrows { display: flex; justify-content: space-between; margin-bottom: 10px; }

  .arrow { cursor: pointer; font-size: 22px; user-select: none; padding: 5px 10px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

  .allergy { display: inline-block; padding: 5px 10px; margin: 5px; border-radius: 8px; font-size: 13px; }

  .ok { background: #d4f8d4; color: green; }
  .no { background: #ffd6d6; color: red; }
  .unknown { background: #e6e6e6; color: gray; }

</style>
</head>
<body>

<h1>Annuaire des Personnes</h1>

<input type="file" id="jsonFile" accept=".json">
<button onclick="chargerJSON()">Charger JSON</button>

<div id="searchContainer">
  <input type="text" id="search" placeholder="Recherche..." oninput="filtrer()">

  <select id="sortSelect" onchange="filtrer()">
    <option value="none">Aucun tri</option>
    <option value="prenom">Prénom</option>
    <option value="nom">Nom</option>
    <option value="age">Âge</option>
  </select>

  <button onclick="toggleReverse()" id="reverseBtn">⬇ Ordre normal</button>

  <div id="helpIcon" onclick="toggleHelp()">❓</div>
  <div id="helpPopup">
    <strong>Raccourcis :</strong>
    <ul>
      <li>prenom:Jean</li>
      <li>nom:Claude</li>
      <li>classe:2B</li>
      <li>id:#0001</li>
      <li>date:31/12/2000</li>
      <li>contact:tel, insta, snap, mail</li>
    </ul>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div><strong>Total</strong><div id="dashTotal">0</div></div>
  <div><strong>Classes</strong><div id="dashClasses">0</div></div>
  <div><strong>Moyenne âge</strong><div id="dashAge">0</div></div>
</div>

<div class="cards" id="cards"></div>

<div id="details">

  <div class="nav-arrows">
    <div class="arrow" onclick="prevPerson()">⬅</div>
    <button onclick="retour()">Retour</button>
    <div class="arrow" onclick="nextPerson()">➡</div>
  </div>

  <div class="profile-layout">
    <div class="profile-left" id="descBox"></div>
    <div class="profile-center">
      <h2 id="detailsName"></h2>
      <img id="detailsPhoto" style="width:200px;height:200px;object-fit:cover;border-radius:10px;">
    </div>
    <div class="profile-right" id="detailsInfo"></div>
  </div>

  <h3>Allergies</h3>
  <div id="allergies"></div>

  <h3>Classe</h3>
  <div class="cards" id="classmates"></div>

</div>

<script>
let personnes = [];
let filtered = [];
let currentIndex = 0;
let reverse = false;

function chargerJSON(){
  const file = document.getElementById("jsonFile").files[0];
  const reader = new FileReader();
  reader.onload = e => {
    personnes = JSON.parse(e.target.result);
    filtered = personnes;
    updateDashboard();
    afficher(filtered);
  };
  reader.readAsText(file);
}

function calcAge(dateStr){
  if(!dateStr) return 0;
  const [d,m,y]=dateStr.split("/");
  return new Date().getFullYear()-new Date(`${y}-${m}-${d}`).getFullYear();
}

function updateDashboard(){
  document.getElementById("dashTotal").innerText = personnes.length;

  const classes = new Set(personnes.map(p=>p.classe));
  document.getElementById("dashClasses").innerText = classes.size;

  const avg = personnes.reduce((a,b)=>a+calcAge(b.dateNaissance),0)/personnes.length;
  document.getElementById("dashAge").innerText = avg.toFixed(1);
}

function toggleReverse(){
  reverse = !reverse;
  document.getElementById("reverseBtn").innerText = reverse ? "⬆ Ordre inversé" : "⬇ Ordre normal";
  filtrer();
}

function toggleHelp(){
  const popup = document.getElementById("helpPopup");
  popup.style.display = popup.style.display === "block" ? "none" : "block";
}

document.addEventListener("click", e => {
  if (!e.target.closest("#helpIcon") && !e.target.closest("#helpPopup")) {
    document.getElementById("helpPopup").style.display = "none";
  }
});

function applySort(list){
  const t=document.getElementById("sortSelect").value;
  let arr=[...list];

  arr.sort((a,b)=>{
    if(t=="prenom") return a.prenom.localeCompare(b.prenom);
    if(t=="nom") return a.nom.localeCompare(b.nom);
    if(t=="age") return calcAge(a.dateNaissance)-calcAge(b.dateNaissance);
    return 0;
  });

  if(reverse) arr.reverse();
  return arr;
}

function filtrer(){
  const q=document.getElementById("search").value.toLowerCase();

  filtered = personnes.filter(p=>{

    const contact = (
      p.tel?.valeur ||
      p.insta?.valeur ||
      p.snap?.valeur ||
      p.mail?.valeur ||
      ""
    ).toLowerCase();

    return (
      (p.prenom+p.nom+p.classe+p.id).toLowerCase().includes(q) ||
      contact.includes(q)
    );
  });

  filtered = applySort(filtered);
  afficher(filtered);
}

function afficher(list){
  const c=document.getElementById("cards");
  c.innerHTML="";

  list.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="card";
    d.onclick=()=>openProfile(i);
    d.innerHTML=`<img src='${p.photo.valeur}'><div><strong>${p.prenom} ${p.nom}</strong></div>`;
    c.appendChild(d);
  });
}

function openProfile(i){ currentIndex=i; showProfile(); }

function showProfile(){
  const p=filtered[currentIndex];

  document.getElementById("cards").style.display="none";
  document.getElementById("details").style.display="block";

  document.getElementById("detailsName").innerText=p.prenom+" "+p.nom;
  document.getElementById("detailsPhoto").src=p.photo.valeur;

  document.getElementById("descBox").innerHTML=`<h3>Description</h3><p>${p.description.valeur}</p>`;

  document.getElementById("detailsInfo").innerHTML=`
    <div>ID: ${p.id}</div>
    <div>Classe: ${p.classe}</div>
    <div>Date: ${p.dateNaissance}</div>
  `;

  let a="";
  if(p.allergies){
    p.allergies.forEach(x=>{
      let cls=x.statut=="ok"?"ok":x.statut=="non"?"no":"unknown";
      let ic=x.statut=="ok"?"✔":x.statut=="non"?"❌":"❓";
      a+=`<span class='allergy ${cls}'>${ic} ${x.nom}</span>`;
    });
  }
  document.getElementById("allergies").innerHTML=a;

  const c=document.getElementById("classmates");
  c.innerHTML="";

  filtered.forEach((x,i)=>{
    if(x.classe===p.classe && i!==currentIndex){
      const d=document.createElement("div");
      d.className="card";
      d.onclick=()=>{currentIndex=i;showProfile();};
      d.innerHTML=`<img src='${x.photo.valeur}'><div>${x.prenom}</div>`;
      c.appendChild(d);
    }
  });
}

function nextPerson(){ if(currentIndex<filtered.length-1) currentIndex++,showProfile(); }
function prevPerson(){ if(currentIndex>0) currentIndex--,showProfile(); }
function retour(){ document.getElementById("details").style.display="none"; document.getElementById("cards").style.display="flex"; }

</script>

</body>
</html>
