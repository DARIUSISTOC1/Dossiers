<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Annuaire des Personnes</title>

<style>

  body { 

    font-family: Arial, sans-serif; 

    background: #f5f5f5; 

    display: flex; 

    flex-direction: column; 

    align-items: center; 

    padding: 20px;

  }

  h1,h3 { margin-bottom: 10px; text-align: center; }

  input, button { padding: 8px; margin: 5px; }

  #searchContainer { position: relative; display: flex; align-items: center; justify-content: center; margin-top: 20px; }

  #search { width: 300px; padding: 8px; }

  #helpIcon { cursor: pointer; margin-left: 5px; font-weight: bold; font-size: 18px; }

  #helpPopup { 

    display: none; 

    position: absolute; 

    top: 30px; 

    right: 0; 

    background: #fff; 

    border: 1px solid #ccc; 

    border-radius: 5px; 

    padding: 10px; 

    width: 250px; 

    box-shadow: 0 2px 8px rgba(0,0,0,0.2);

    z-index: 10;

  }

  .cards { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; justify-content: center; }

  .card { background: white; padding: 10px; border-radius: 8px; width: 200px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }

  .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }

  .field { font-size: 14px; margin: 2px 0; }

  .modified { font-size: 12px; color: gray; }

  #details { display: none; margin-top: 20px; text-align: center; }

  .other-classmates { margin-top: 15px; }

</style>

</head>

<body>



<h1>Annuaire des Personnes</h1>



<input type="file" id="jsonFile" accept=".json">

<button onclick="chargerJSON()">Charger JSON</button>



<div id="searchContainer">

  <input type="text" id="search" placeholder="Recherche globale ou prenom:, nom:, classe:, id:, date:, num:" oninput="filtrer()">

  <div id="helpIcon" onclick="toggleHelp()">&#x2753;</div>

  <div id="helpPopup">

    <strong>Raccourcis de recherche :</strong>

    <ul style="padding-left: 15px;">

      <li><code>prenom:Jean</code></li>

      <li><code>nom:Claude</code></li>

      <li><code>classe:2B</code></li>

      <li><code>id:#0001</code></li>

      <li><code>date:31/12/2000</code></li>

      <li><code>num:067553232</code></li>

    </ul>

    <em>Sans préfixe, recherche globale</em>

  </div>

</div>



<div class="cards" id="cards"></div>



<div id="details">

  <button onclick="retour()">← Retour à la liste</button>

  <h2 id="detailsName"></h2>

  <img id="detailsPhoto" style="width:200px;height:200px;object-fit:cover;border-radius:5px;">

  <div id="detailsInfo"></div>

  <h3>Autres élèves de la même classe</h3>

  <div class="cards" id="classmates"></div>

</div>



<script>

let personnes = [];

let currentPerson = null;



function toggleHelp(){

  const popup = document.getElementById("helpPopup");

  popup.style.display = popup.style.display === "block" ? "none" : "block";

}



function chargerJSON() {

  const fileInput = document.getElementById("jsonFile");

  if (!fileInput.files[0]) { alert("Sélectionne un fichier JSON"); return; }

  const reader = new FileReader();

  reader.onload = function(e) {

    personnes = JSON.parse(e.target.result);

    afficher(personnes);

  };

  reader.readAsText(fileInput.files[0]);

}



function afficher(liste) {

  document.getElementById("details").style.display = "none";

  const container = document.getElementById("cards");

  container.innerHTML = "";

  liste.forEach((p, index) => {

    const card = document.createElement("div");

    card.className = "card";

    card.onclick = () => montrerDetails(index);

    card.innerHTML = `

      <img src="${p.photo.valeur}">

      <div class="field"><strong>${p.prenom} ${p.nom}</strong></div>

      <div class="field">ID: ${p.id}</div>

      <div class="field">Classe: ${p.classe}</div>

      <div class="field">Naissance: ${p.dateNaissance}</div>

    `;

    container.appendChild(card);

  });

}



function filtrer() {

  const recherche = document.getElementById("search").value.toLowerCase();

  const resultat = personnes.filter((p) => {

    let matched = false;

    if (recherche.startsWith("prenom:")) {

      matched = p.prenom.toLowerCase().includes(recherche.slice(7).trim());

    } else if (recherche.startsWith("nom:")) {

      matched = p.nom.toLowerCase().includes(recherche.slice(4).trim());

    } else if (recherche.startsWith("classe:")) {

      matched = p.classe.toLowerCase().includes(recherche.slice(7).trim());

    } else if (recherche.startsWith("id:")) {

      matched = p.id.toLowerCase().includes(recherche.slice(3).trim());

    } else if (recherche.startsWith("date:")) {

      matched = p.dateNaissance.toLowerCase().includes(recherche.slice(5).trim());

    } else if (recherche.startsWith("num:")) {

      matched = p.tel && p.tel.valeur.toLowerCase().includes(recherche.slice(4).trim());

    } else {

      matched =

        p.prenom.toLowerCase().includes(recherche) ||

        p.nom.toLowerCase().includes(recherche) ||

        p.classe.toLowerCase().includes(recherche) ||

        p.id.toLowerCase().includes(recherche) ||

        p.dateNaissance.toLowerCase().includes(recherche) ||

        (p.tel && p.tel.valeur.toLowerCase().includes(recherche)) ||

        (p.description && p.description.valeur.toLowerCase().includes(recherche));

    }

    return matched;

  });

  afficher(resultat);

}



function montrerDetails(index) {

  currentPerson = personnes[index];

  document.getElementById("cards").style.display = "none";

  const details = document.getElementById("details");

  details.style.display = "block";

  document.getElementById("detailsName").innerText = currentPerson.prenom + " " + currentPerson.nom;

  document.getElementById("detailsPhoto").src = currentPerson.photo.valeur;



  let infoHTML = `

    <div class="field">ID: ${currentPerson.id}</div>

    <div class="field">Classe: ${currentPerson.classe}</div>

    <div class="field">Naissance: ${currentPerson.dateNaissance}</div>

  `;



  const champsModifiables = ["tel","taille","pointure","surnoms","description","photo"];

  champsModifiables.forEach(champ => {

    if(currentPerson[champ]){

      let val = currentPerson[champ].valeur;

      if(Array.isArray(val)) val = val.join(", ");

      infoHTML += `<div class="field">${champ.charAt(0).toUpperCase()+champ.slice(1)}: ${val} <span class="modified">(modifié le ${currentPerson[champ].modifieLe})</span></div>`;

    }

  });



  document.getElementById("detailsInfo").innerHTML = infoHTML;



  // Autres élèves même classe

  const container = document.getElementById("classmates");

  container.innerHTML = "";

  personnes.forEach((p, idx) => {

    if(idx !== index && p.classe === currentPerson.classe){

      const card = document.createElement("div");

      card.className = "card";

      card.onclick = () => montrerDetails(idx);

      card.innerHTML = `

        <img src="${p.photo.valeur}">

        <div class="field"><strong>${p.prenom} ${p.nom}</strong></div>

        <div class="field">ID: ${p.id}</div>

      `;

      container.appendChild(card);

    }

  });

}



function retour(){

  document.getElementById("details").style.display = "none";

  document.getElementById("cards").style.display = "flex";

  filtrer();

}

</script>



</body>

</html>
